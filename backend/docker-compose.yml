services:
  postgres:
    image: postgres:16
    container_name: ai-deal-detector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aidealdetector
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aidealdetector"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: ai-deal-detector-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=aidealdetector;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
